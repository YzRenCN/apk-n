<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nortbook 起始页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            /* 为了更有原生感，增加深色/浅色渐变背景 */
            background: linear-gradient(135deg, #f5f6f8 0%, #e8eaed 100%);
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            padding-top: calc(24px + env(safe-area-inset-top));
        }

        /* 顶部 Logo 与欢迎词 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: #3b4cca;
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(59, 76, 202, 0.3);
        }
        .logo-text {
            font-size: 32px;
            font-weight: 900;
            color: #1a202c;
            letter-spacing: -0.5px;
        }
        .welcome-text {
            font-size: 15px;
            color: #718096;
            font-weight: 500;
        }

        /* 工具网格（2x2） */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 400px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        /* 单个工具卡片 */
        .tool-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 28px 16px;
            background: #ffffff;
            border-radius: 16px;
            text-decoration: none;
            color: #1a202c;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tool-card:active {
            transform: scale(0.96);
            background: #fafbfd;
            border-color: #c5caf0;
        }

        /* 卡片图标 */
        .tool-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        /* 卡片名称 */
        .tool-name {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
            letter-spacing: -0.3px;
        }
        .tool-en {
            font-size: 11px;
            font-weight: 600;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: -6px;
        }

        /* 图标背景色 */
        .bg-word  { background: #e8e8ff; }
        .bg-diary { background: #f3e5fa; }
        .bg-ppt   { background: #fdeae4; }
        .bg-sheet { background: #e8f7ee; }

        /* 底部版权 */
        .footer {
            margin-top: 48px;
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 针对小屏幕手机优化 */
        @media (max-width: 360px) {
            .logo-text { font-size: 28px; }
            .tool-card { padding: 20px 12px; }
            .tool-icon { width: 48px; height: 48px; font-size: 24px; }
            .tool-name { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- 头部 -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">N</div>
            <div class="logo-text">Nortbook</div>
        </div>
        <div class="welcome-text">选择你需要的办公工具</div>
    </div>

    <!-- 工具网格 -->
    <div class="tools-grid">
        
        <!-- Word -->
        <a href="word.html" class="tool-card">
            <div class="tool-icon bg-word">📄</div>
            <div class="tool-name">Word</div>
            <div class="tool-en">Document</div>
        </a>

        <!-- 日记 -->
        <a href="diary.html" class="tool-card">
            <div class="tool-icon bg-diary">📔</div>
            <div class="tool-name">日记</div>
            <div class="tool-en">Diary</div>
        </a>

        <!-- PPT -->
        <a href="ppt.html" class="tool-card">
            <div class="tool-icon bg-ppt">📊</div>
            <div class="tool-name">演示文稿</div>
            <div class="tool-en">Presentation</div>
        </a>

        <!-- 表格 -->
        <a href="sheet.html" class="tool-card">
            <div class="tool-icon bg-sheet">📈</div>
            <div class="tool-name">电子表格</div>
            <div class="tool-en">Spreadsheet</div>
        </a>

    </div>

    <!-- 底部 -->
    <div class="footer">
        © NorStudio 2026 · 数据保存在本地
    </div>

</body>
</html>
