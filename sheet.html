<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nortbook 电子表格</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; background: #f5f6f8; overflow: hidden; }
        body { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

        /* ==================== 顶部工具栏 ==================== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        .toolbar button, .toolbar select {
            height: 36px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafbfd;
            color: #333;
            white-space: nowrap;
            flex-shrink: 0;
            outline: none;
        }
        .toolbar button.primary { background: #3b4cca; color: #fff; border-color: #3b4cca; }
        .toolbar button.danger { color: #c53030; }

        /* ==================== 公式栏 ==================== */
        .formula-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .cell-ref {
            min-width: 50px;
            font-size: 13px;
            font-weight: 700;
            color: #3b4cca;
            padding: 6px 10px;
            background: #e8e8ff;
            border-radius: 4px;
            text-align: center;
            flex-shrink: 0;
        }
        .formula-input {
            flex: 1;
            height: 32px;
            padding: 0 10px;
            font-family: "Consolas", monospace;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fff;
            color: #333;
            outline: none;
            min-width: 0;
        }
        .formula-input:focus { border-color: #3b4cca; }

        /* ==================== 表格区域 ==================== */
        .grid-wrapper {
            flex: 1;
            overflow: auto;
            background: #e8eaed;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .sheet-table {
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
            font-family: inherit;
            font-size: 13px;
            table-layout: fixed;
        }
        .sheet-table th {
            background: #f0f0f5;
            border-right: 1px solid #d8d8dc;
            border-bottom: 1px solid #d8d8dc;
            font-weight: 600;
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 0;
            height: 28px;
            user-select: none;
        }
        .sheet-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .sheet-table .row-header {
            position: sticky;
            left: 0;
            z-index: 2;
            background: #f0f0f5;
            border-right: 1px solid #d8d8dc;
            border-bottom: 1px solid #d8d8dc;
            font-weight: 600;
            font-size: 11px;
            color: #666;
            text-align: center;
            width: 40px;
            min-width: 40px;
            height: 28px;
            padding: 0;
            user-select: none;
        }
        .sheet-table .corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 3;
            background: #e8e8ec;
            width: 40px;
            min-width: 40px;
        }
        .sheet-table td {
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            padding: 4px 8px;
            min-width: 100px;
            width: 100px;
            height: 36px;
            vertical-align: middle;
            outline: none;
            background: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            cursor: cell;
            position: relative;
        }
        .sheet-table td:focus {
            box-shadow: inset 0 0 0 2px #3b4cca;
            background: #f8f8ff;
            z-index: 1;
            overflow: visible;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .sheet-table td.selected { background: #f8f8ff; box-shadow: inset 0 0 0 1px #c5caf0; }
        .sheet-table td[data-formula="1"] { background: #fafaf0; }
        .sheet-table td[data-formula="1"]::after {
            content: 'ƒ';
            position: absolute;
            top: 1px;
            right: 4px;
            font-size: 9px;
            color: #a0a050;
            font-style: italic;
            font-weight: 700;
            pointer-events: none;
        }
        .sheet-table td[data-error="1"] { color: #c53030; }

        /* ==================== 底部状态栏 ==================== */
        .status-bar {
            height: 30px;
            padding: 0 16px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <button class="primary" id="saveBtn">导出 Excel</button>
        <button id="undoBtn">撤销</button>
        <button id="redoBtn">重做</button>
        <select id="fontSizeSel">
            <option value="12px">12</option>
            <option value="13px" selected>13</option>
            <option value="14px">14</option>
            <option value="16px">16</option>
            <option value="18px">18</option>
        </select>
        <button id="boldBtn"><b>B</b></button>
        <button id="alignLeftBtn">左对齐</button>
        <button id="alignCenterBtn">居中</button>
        <button id="alignRightBtn">右对齐</button>
        <button id="insertRowBtn">+ 行</button>
        <button id="deleteRowBtn">- 行</button>
        <button id="insertColBtn">+ 列</button>
        <button id="deleteColBtn">- 列</button>
    </div>

    <!-- 公式栏 -->
    <div class="formula-bar">
        <div class="cell-ref" id="cellRef">A1</div>
        <input type="text" class="formula-input" id="formulaInput" placeholder="输入内容或公式，如 =SUM(A1:A5)" spellcheck="false">
    </div>

    <!-- 表格区域 -->
    <div class="grid-wrapper" id="gridWrapper">
        <table class="sheet-table" id="sheetTable">
            <thead id="sheetThead"></thead>
            <tbody id="sheetTbody"></tbody>
        </table>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
        <span id="statusInfo">就绪</span>
        <span id="saveStatus">自动保存</span>
    </div>

    <script>
        (function() {
            var sheetThead = document.getElementById('sheetThead');
            var sheetTbody = document.getElementById('sheetTbody');
            var cellRef = document.getElementById('cellRef');
            var formulaInput = document.getElementById('formulaInput');
            var statusInfo = document.getElementById('statusInfo');
            var saveStatus = document.getElementById('saveStatus');
            var gridWrapper = document.getElementById('gridWrapper');

            var STORAGE_KEY = 'nortbook_sheet_mobile_v1';
            var MAX_COLS = 20; // 移动端限制列数
            var MAX_ROWS = 100; // 移动端限制行数
            var HISTORY_LIMIT = 30;

            var cells = {};
            var activeCellRef = null;
            var saveTimer = null;
            var history = [];
            var redoStack = [];
            var isRestoring = false;

            // 列字母转换
            function colLetter(index) {
                var s = '';
                var i = index + 1;
                while (i > 0) {
                    i--;
                    s = String.fromCharCode(65 + (i % 26)) + s;
                    i = Math.floor(i / 26);
                }
                return s;
            }

            function cellRefStr(col, row) {
                return colLetter(col) + (row + 1);
            }

            function parseRef(ref) {
                var m = ref.match(/^([A-Z]+)(\d+)$/);
                if (!m) return null;
                var colStr = m[1];
                var row = parseInt(m[2], 10) - 1;
                var col = 0;
                for (var i = 0; i < colStr.length; i++) {
                    col = col * 26 + (colStr.charCodeAt(i) - 64);
                }
                col = col - 1;
                return { col: col, row: row };
            }

            // ==================== 公式引擎 ====================
            function evaluateFormula(formula, xValue) {
                var s = String(formula).trim();
                if (!s) return 0;
                if (!/^[0-9+\-*/().,\s^!%a-zA-Z_π]*$/.test(s)) throw new Error('包含不允许的字符');

                var functionNames = ['asin','acos','atan','sin','cos','tan','log','ln','sqrt','cbrt','abs','floor','ceil','round','exp','pow','fact'];
                var testStr = s;
                functionNames.forEach(function(fn) {
                    testStr = testStr.replace(new RegExp('\\b' + fn + '\\b', 'g'), '');
                });
                testStr = testStr.replace(/π/g, '').replace(/\be\b/g, '').replace(/\bAns\b/g, '').replace(/\bx\b/g, '');
                if (/[a-zA-Z]/.test(testStr)) throw new Error('未知标识符');

                var js = s;
                js = js.replace(/(\d+(?:\.\d+)?|\))\s*!/g, 'fact($1)');
                js = js.replace(/\^/g, '**');
                js = js.replace(/π/g, 'Math.PI');
                js = js.replace(/\be\b/g, 'Math.E');
                js = js.replace(/\bAns\b/g, '(__ANS__)');
                
                if (xValue !== undefined) js = js.replace(/\bx\b/g, '(' + xValue + ')');

                var funcMapping = {
                    'asin': 'Math.asin', 'acos': 'Math.acos', 'atan': 'Math.atan',
                    'sin': 'Math.sin', 'cos': 'Math.cos', 'tan': 'Math.tan',
                    'log': 'Math.log10', 'ln': 'Math.log',
                    'sqrt': 'Math.sqrt', 'cbrt': 'Math.cbrt',
                    'abs': 'Math.abs', 'floor': 'Math.floor', 'ceil': 'Math.ceil',
                    'round': 'Math.round', 'exp': 'Math.exp', 'pow': 'Math.pow',
                    'fact': '__fact'
                };
                var keys = Object.keys(funcMapping).sort(function(a, b) { return b.length - a.length; });
                keys.forEach(function(fn) {
                    js = js.replace(new RegExp('\\b' + fn + '\\s*\\(', 'g'), funcMapping[fn] + '(');
                });
                js = js.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

                function __fact(n) {
                    n = Math.floor(n);
                    if (n < 0) return NaN;
                    if (n > 170) return Infinity;
                    var r = 1;
                    for (var i = 2; i <= n; i++) r *= i;
                    return r;
                }

                try {
                    var fn = new Function('__fact', '__ANS__', 'return (' + js + ');');
                    var result = fn(__fact, 0);
                    if (typeof result !== 'number' || !isFinite(result)) throw new Error('结果无效');
                    return result;
                } catch (e) {
                    throw new Error('公式错误');
                }
            }

            // ==================== 渲染表格 ====================
            function renderTable() {
                // 表头
                var theadHtml = '<tr><th class="corner"></th>';
                for (var c = 0; c < MAX_COLS; c++) {
                    theadHtml += '<th>' + colLetter(c) + '</th>';
                }
                theadHtml += '</tr>';
                sheetThead.innerHTML = theadHtml;

                // 表体
                var tbodyHtml = '';
                for (var r = 0; r < MAX_ROWS; r++) {
                    tbodyHtml += '<tr>';
                    tbodyHtml += '<th class="row-header">' + (r + 1) + '</th>';
                    for (var col = 0; col < MAX_COLS; col++) {
                        var ref = cellRefStr(col, r);
                        var cell = cells[ref];
                        var val = cell && cell.v != null ? cell.v : '';
                        var style = cell && cell.s ? cell.s : '';
                        var isFormula = cell && cell.f;
                        var isError = typeof val === 'string' && val.charAt(0) === '#';
                        
                        tbodyHtml += '<td contenteditable="true" data-ref="' + ref + '"' +
                                     (isFormula ? ' data-formula="1"' : '') +
                                     (isError ? ' data-error="1"' : '') +
                                     (style ? ' style="' + style + '"' : '') + '>' +
                                     escapeHtml(String(val)) + '</td>';
                    }
                    tbodyHtml += '</tr>';
                }
                sheetTbody.innerHTML = tbodyHtml;

                bindCellEvents();
                if (activeCellRef) {
                    var active = sheetTbody.querySelector('td[data-ref="' + activeCellRef + '"]');
                    if (active) {
                        active.classList.add('selected');
                        cellRef.textContent = activeCellRef;
                        var cell = cells[activeCellRef];
                        formulaInput.value = cell && cell.f ? '=' + cell.f : (cell && cell.v ? cell.v : '');
                    }
                }
                updateStatus();
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function bindCellEvents() {
                var tds = sheetTbody.querySelectorAll('td');
                tds.forEach(function(td) {
                    td.addEventListener('focus', function() {
                        var ref = this.getAttribute('data-ref');
                        activeCellRef = ref;
                        cellRef.textContent = ref;
                        
                        sheetTbody.querySelectorAll('td.selected').forEach(function(t) { t.classList.remove('selected'); });
                        this.classList.add('selected');

                        var cell = cells[ref];
                        if (cell && cell.f) this.innerText = '=' + cell.f;
                        formulaInput.value = cell && cell.f ? '=' + cell.f : (cell && cell.v ? cell.v : '');
                    });

                    td.addEventListener('blur', function() {
                        saveCell(this);
                        var ref = this.getAttribute('data-ref');
                        var cell = cells[ref];
                        if (cell) {
                            this.innerText = cell.v != null ? String(cell.v) : '';
                            var isError = typeof cell.v === 'string' && cell.v.charAt(0) === '#';
                            this.classList.remove('selected');
                            if (cell.f) this.setAttribute('data-formula', '1'); else this.removeAttribute('data-formula');
                            if (isError) this.setAttribute('data-error', '1'); else this.removeAttribute('data-error');
                        }
                    });

                    td.addEventListener('input', function() {
                        var el = this;
                        clearTimeout(el._saveTimer);
                        el._saveTimer = setTimeout(function() {
                            saveCell(el);
                        }, 300);
                    });
                });
            }

            // 保存单元格
            function saveCell(td) {
                var ref = td.getAttribute('data-ref');
                var raw = td.innerText.trim();
                var style = td.getAttribute('style') || '';

                pushHistory();

                if (raw.charAt(0) === '=' && raw.length > 1) {
                    var formula = raw.slice(1);
                    if (!cells[ref]) cells[ref] = {};
                    cells[ref].f = formula;
                    try {
                        var result = evaluateFormula(formula);
                        cells[ref].v = String(result);
                    } catch (e) {
                        cells[ref].v = '#ERR!';
                    }
                    if (style) cells[ref].s = style; else delete cells[ref].s;
                    td.setAttribute('data-formula', '1');
                    if (cells[ref].v.charAt(0) === '#') td.setAttribute('data-error', '1'); else td.removeAttribute('data-error');
                } else {
                    if (!raw && !style) {
                        delete cells[ref];
                    } else {
                        if (!cells[ref]) cells[ref] = {};
                        cells[ref].v = raw;
                        delete cells[ref].f;
                        if (style) cells[ref].s = style; else delete cells[ref].s;
                    }
                    td.removeAttribute('data-formula');
                    td.removeAttribute('data-error');
                }
                autoSave();
            }

            // ==================== 撤销重做 ====================
            function pushHistory() {
                if (isRestoring) return;
                history.push(JSON.stringify(cells));
                if (history.length > HISTORY_LIMIT) history.shift();
                redoStack = [];
            }

            function undo() {
                if (history.length === 0) return;
                redoStack.push(JSON.stringify(cells));
                cells = JSON.parse(history.pop());
                renderTable();
                autoSave();
            }

            function redo() {
                if (redoStack.length === 0) return;
                history.push(JSON.stringify(cells));
                cells = JSON.parse(redoStack.pop());
                renderTable();
                autoSave();
            }

            // ==================== 行列操作 ====================
            function insertRow() {
                if (!activeCellRef) return;
                var pos = parseRef(activeCellRef);
                if (!pos || MAX_ROWS >= 200) return;
                pushHistory();
                var newCells = {};
                Object.keys(cells).forEach(function(ref) {
                    var p = parseRef(ref);
                    if (p.row >= pos.row) {
                        if (p.row + 1 < MAX_ROWS) newCells[cellRefStr(p.col, p.row + 1)] = cells[ref];
                    } else newCells[ref] = cells[ref];
                });
                cells = newCells;
                renderTable();
                autoSave();
            }

            function deleteRow() {
                if (!activeCellRef) return;
                var pos = parseRef(activeCellRef);
                if (!pos) return;
                pushHistory();
                var newCells = {};
                Object.keys(cells).forEach(function(ref) {
                    var p = parseRef(ref);
                    if (p.row === pos.row) return;
                    if (p.row > pos.row) newCells[cellRefStr(p.col, p.row - 1)] = cells[ref];
                    else newCells[ref] = cells[ref];
                });
                cells = newCells;
                renderTable();
                autoSave();
            }

            function insertCol() {
                if (!activeCellRef) return;
                var pos = parseRef(activeCellRef);
                if (!pos || MAX_COLS >= 26) return;
                pushHistory();
                var newCells = {};
                Object.keys(cells).forEach(function(ref) {
                    var p = parseRef(ref);
                    if (p.col >= pos.col) {
                        if (p.col + 1 < MAX_COLS) newCells[cellRefStr(p.col + 1, p.row)] = cells[ref];
                    } else newCells[ref] = cells[ref];
                });
                cells = newCells;
                renderTable();
                autoSave();
            }

            function deleteCol() {
                if (!activeCellRef) return;
                var pos = parseRef(activeCellRef);
                if (!pos) return;
                pushHistory();
                var newCells = {};
                Object.keys(cells).forEach(function(ref) {
                    var p = parseRef(ref);
                    if (p.col === pos.col) return;
                    if (p.col > pos.col) newCells[cellRefStr(p.col - 1, p.row)] = cells[ref];
                    else newCells[ref] = cells[ref];
                });
                cells = newCells;
                renderTable();
                autoSave();
            }

            // ==================== 样式操作 ====================
            function applyStyle(prop, value) {
                if (!activeCellRef) return;
                var td = sheetTbody.querySelector('td[data-ref="' + activeCellRef + '"]');
                if (!td) return;

                if (prop === 'font-weight') {
                    td.style.fontWeight = td.style.fontWeight === 'bold' ? 'normal' : 'bold';
                } else if (prop === 'textAlign') {
                    td.style.textAlign = value;
                } else {
                    td.style[prop] = value;
                }
                saveCell(td);
            }

            // ==================== 自动保存 ====================
            function autoSave() {
                saveStatus.textContent = '保存中…';
                clearTimeout(saveTimer);
                saveTimer = setTimeout(function() {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(cells));
                        saveStatus.textContent = '已保存';
                    } catch (e) {
                        saveStatus.textContent = '保存失败';
                    }
                }, 400);
            }

            function loadData() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) cells = JSON.parse(raw) || {};
                } catch (e) { cells = {}; }
            }

            function updateStatus() {
                var count = Object.keys(cells).length;
                statusInfo.textContent = '共 ' + count + ' 个有内容单元格';
            }

            // ==================== 导出 Excel ====================
            document.getElementById('saveBtn').addEventListener('click', function() {
                if (typeof XLSX === 'undefined') {
                    alert('导出库未加载，请检查网络');
                    return;
                }
                
                var maxRow = 0, maxCol = 0;
                Object.keys(cells).forEach(function(ref) {
                    var p = parseRef(ref);
                    if (p.row > maxRow) maxRow = p.row;
                    if (p.col > maxCol) maxCol = p.col;
                });

                var data = [];
                for (var r = 0; r <= maxRow; r++) {
                    var row = [];
                    for (var c = 0; c <= maxCol; c++) {
                        var ref = cellRefStr(c, r);
                        row.push(cells[ref] && cells[ref].v != null ? cells[ref].v : '');
                    }
                    data.push(row);
                }
                if (data.length === 0) data = [['']];

                var ws = XLSX.utils.aoa_to_sheet(data);
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                XLSX.writeFile(wb, 'Nortbook_Sheet_' + Date.now() + '.xlsx');
            });

            // ==================== 事件绑定 ====================
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('boldBtn').addEventListener('click', function() { applyStyle('font-weight'); });
            document.getElementById('alignLeftBtn').addEventListener('click', function() { applyStyle('textAlign', 'left'); });
            document.getElementById('alignCenterBtn').addEventListener('click', function() { applyStyle('textAlign', 'center'); });
            document.getElementById('alignRightBtn').addEventListener('click', function() { applyStyle('textAlign', 'right'); });
            document.getElementById('fontSizeSel').addEventListener('change', function() { applyStyle('fontSize', this.value); });
            document.getElementById('insertRowBtn').addEventListener('click', insertRow);
            document.getElementById('deleteRowBtn').addEventListener('click', deleteRow);
            document.getElementById('insertColBtn').addEventListener('click', insertCol);
            document.getElementById('deleteColBtn').addEventListener('click', deleteCol);

            // 公式栏输入
            formulaInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!activeCellRef) return;
                    var td = sheetTbody.querySelector('td[data-ref="' + activeCellRef + '"]');
                    if (!td) return;
                    td.innerText = formulaInput.value;
                    saveCell(td);
                    td.blur();
                }
            });

            // 阻止画布默认的滚动干扰
            gridWrapper.addEventListener('touchmove', function(e) {
                // 允许正常的双指或单指滚动
            }, { passive: true });

            // 关闭前保存
            window.addEventListener('beforeunload', function() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cells)); } catch (e) {}
            });

            // ==================== 初始化 ====================
            loadData();
            renderTable();
            saveStatus.textContent = '就绪';
        })();
    </script>
</body>
</html>
