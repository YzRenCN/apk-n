<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nortbook 日记</title>
    <!-- 引入 JSZip 用于备份 -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; background: #f5f6f8; overflow: hidden; }
        body { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

        /* ==================== 顶部工具栏 ==================== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .toolbar::-webkit-scrollbar { display: none; }
        .toolbar button {
            height: 36px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fafbfd;
            color: #333;
            white-space: nowrap;
            flex-shrink: 0;
            outline: none;
        }
        .toolbar button.primary { background: #3b4cca; color: #fff; border-color: #3b4cca; }
        .toolbar button.danger { color: #c53030; }
        .toolbar .spacer { flex: 1; }

        /* ==================== 主内容 ==================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 编辑面板 */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
        }

        /* 元信息（类型 + 日期 + 心情） */
        .meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .meta-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #666;
        }
        .meta-type {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            background: #e8e8ff;
            color: #3b4cca;
        }
        .meta-type.note { background: #edf2f7; color: #718096; }
        
        .mood-picker {
            display: flex;
            gap: 4px;
        }
        .mood-btn {
            background: transparent;
            border: 1px solid transparent;
            font-size: 18px;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            filter: grayscale(1);
            opacity: 0.5;
            transition: all 0.15s;
        }
        .mood-btn.active {
            background: #e8e8ff;
            border-color: #c5caf0;
            filter: grayscale(0);
            opacity: 1;
        }

        /* 标题输入 */
        .title-input {
            width: 100%;
            padding: 16px 20px 8px;
            border: none;
            outline: none;
            font-size: 22px;
            font-weight: 800;
            color: #1a202c;
            background: #ffffff;
            font-family: inherit;
        }
        .title-input::placeholder { color: #c0c8d4; }

        /* 正文输入 */
        .content-input {
            flex: 1;
            width: 100%;
            padding: 8px 20px 24px;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.8;
            color: #1a202c;
            background: #ffffff;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .content-input::placeholder { color: #c0c8d4; }

        /* ==================== 列表面板（抽屉） ==================== */
        .list-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background: #ffffff;
            box-shadow: 4px 0 24px rgba(0,0,0,0.15);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .list-drawer.open { transform: translateX(0); }
        
        .drawer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .drawer-overlay.open { display: block; opacity: 1; }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .drawer-title {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
        }
        .drawer-close {
            background: transparent;
            border: none;
            font-size: 20px;
            color: #888;
            cursor: pointer;
            padding: 4px;
        }

        .entry-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .entry-item {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #fafbfd;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .entry-item:active { background: #f0f0f5; }
        .entry-item.active { background: #e8e8ff; border-color: #c5caf0; }
        
        .entry-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .entry-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a202c;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .entry-date { font-size: 11px; color: #888; margin-left: 8px; }
        .entry-preview {
            font-size: 12px;
            color: #718096;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 底部状态 */
        .status-bar {
            height: 30px;
            padding: 0 16px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <button id="menuBtn">列表</button>
        <button class="primary" id="newNoteBtn">+ 速记</button>
        <button class="primary" id="newDiaryBtn">+ 日记</button>
        <span class="spacer"></span>
        <button class="danger" id="deleteBtn">删除</button>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="editor-panel">
            <!-- 元信息 -->
            <div class="meta-bar">
                <div class="meta-left">
                    <span class="meta-type" id="metaType">速记</span>
                    <span id="metaDate">2026年10月17日</span>
                </div>
                <div class="mood-picker" id="moodPicker" style="display: none;">
                    <button class="mood-btn" data-mood="happy">😊</button>
                    <button class="mood-btn" data-mood="calm">😌</button>
                    <button class="mood-btn" data-mood="sad">😔</button>
                    <button class="mood-btn" data-mood="tired">😴</button>
                    <button class="mood-btn" data-mood="angry">😤</button>
                </div>
            </div>
            
            <!-- 标题与内容 -->
            <input type="text" class="title-input" id="entryTitle" placeholder="标题…">
            <textarea class="content-input" id="entryContent" placeholder="在此输入内容…"></textarea>
        </div>
    </div>

    <!-- 底部状态 -->
    <div class="status-bar">
        <span id="statusText">就绪</span>
        <span id="saveStatus">自动保存</span>
    </div>

    <!-- 侧边抽屉 -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="list-drawer" id="listDrawer">
        <div class="drawer-header">
            <span class="drawer-title">全部记录</span>
            <button class="drawer-close" id="closeDrawerBtn">×</button>
        </div>
        <div class="entry-list" id="entryList"></div>
    </div>

    <script>
        (function() {
            var editorTitle = document.getElementById('entryTitle');
            var editorContent = document.getElementById('entryContent');
            var metaType = document.getElementById('metaType');
            var metaDate = document.getElementById('metaDate');
            var moodPicker = document.getElementById('moodPicker');
            var entryList = document.getElementById('entryList');
            var statusText = document.getElementById('statusText');
            var saveStatus = document.getElementById('saveStatus');
            var listDrawer = document.getElementById('listDrawer');
            var drawerOverlay = document.getElementById('drawerOverlay');

            var STORAGE_KEY = 'nortbook_diary_mobile_v1';
            var entries = [];
            var currentId = null;
            var saveTimer = null;

            var MOODS = {
                happy: '😊', calm: '😌', sad: '😔', tired: '😴', angry: '😤'
            };

            function genId() {
                return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            }

            function formatDate(d) {
                return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
            }

            function formatDateShort(d) {
                return (d.getMonth() + 1) + '-' + d.getDate();
            }

            function stripHtml(html) {
                var tmp = document.createElement('div');
                tmp.innerHTML = html || '';
                return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
            }

            // 加载数据
            function loadData() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) entries = JSON.parse(raw) || [];
                } catch (e) { entries = []; }
            }

            // 保存数据
            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
                } catch (e) {}
            }

            function getCurrentEntry() {
                return entries.find(function(e) { return e.id === currentId; });
            }

            // 同步当前编辑到内存
            function syncCurrent() {
                var e = getCurrentEntry();
                if (!e) return;
                e.title = editorTitle.value.trim();
                e.content = editorContent.value;
                e.updated = Date.now();
            }

            // 自动保存
            function autoSave() {
                saveStatus.textContent = '保存中…';
                clearTimeout(saveTimer);
                saveTimer = setTimeout(function() {
                    syncCurrent();
                    saveData();
                    saveStatus.textContent = '已保存';
                    renderList();
                }, 400);
            }

            // 渲染列表
            function renderList() {
                var sorted = entries.slice().sort(function(a, b) {
                    return (b.date || 0) - (a.date || 0);
                });

                if (sorted.length === 0) {
                    entryList.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#a0aec0;font-size:13px;">暂无记录<br>点击顶部按钮新建</div>';
                    return;
                }

                var html = '';
                sorted.forEach(function(e) {
                    var date = new Date(e.date);
                    var isDiary = e.type === 'diary';
                    var title = e.title || (isDiary ? formatDate(date) : '无标题速记');
                    var preview = stripHtml(e.content).slice(0, 30) || '（暂无内容）';
                    var mood = isDiary && e.mood ? MOODS[e.mood] : '';
                    
                    html += '<div class="entry-item' + (e.id === currentId ? ' active' : '') + '" data-id="' + e.id + '">';
                    html += '<div class="entry-top">';
                    html += '<div class="entry-title">' + escapeHtml(title) + '</div>';
                    html += '<div class="entry-date">' + formatDateShort(date) + '</div>';
                    html += '</div>';
                    html += '<div class="entry-preview">' + escapeHtml(preview) + ' ' + mood + '</div>';
                    html += '</div>';
                });
                entryList.innerHTML = html;

                // 绑定点击
                entryList.querySelectorAll('.entry-item').forEach(function(item) {
                    item.addEventListener('click', function() {
                        var id = this.getAttribute('data-id');
                        openEntry(id);
                        closeDrawer();
                    });
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            // 打开某条记录
            function openEntry(id) {
                if (currentId && currentId !== id) syncCurrent();
                currentId = id;
                
                var e = getCurrentEntry();
                if (!e) return;

                var isDiary = e.type === 'diary';
                var date = new Date(e.date);

                metaType.textContent = isDiary ? '日记' : '速记';
                metaType.className = 'meta-type' + (isDiary ? '' : ' note');
                metaDate.textContent = formatDate(date);

                if (isDiary) {
                    moodPicker.style.display = 'flex';
                    moodPicker.querySelectorAll('.mood-btn').forEach(function(btn) {
                        btn.classList.toggle('active', btn.getAttribute('data-mood') === e.mood);
                    });
                } else {
                    moodPicker.style.display = 'none';
                }

                editorTitle.value = e.title || '';
                editorContent.value = e.content || '';
                editorTitle.placeholder = isDiary ? '给今天起个标题…' : '速记标题（可选）…';

                renderList();
                saveData();
            }

            // 新建
            function createEntry(type) {
                if (currentId) syncCurrent();
                saveData();

                var now = new Date();
                var newEntry = {
                    id: genId(),
                    type: type,
                    title: '',
                    content: '',
                    date: now.getTime(),
                    mood: type === 'diary' ? 'happy' : '',
                    updated: now.getTime()
                };
                entries.unshift(newEntry);
                currentId = newEntry.id;
                saveData();
                openEntry(currentId);
                closeDrawer();
                editorTitle.focus();
            }

            // 删除
            function deleteEntry() {
                if (!currentId) return;
                if (!confirm('确定要删除这条记录吗？不可恢复。')) return;

                entries = entries.filter(function(e) { return e.id !== currentId; });
                currentId = null;
                saveData();

                if (entries.length > 0) {
                    var sorted = entries.slice().sort(function(a, b) { return (b.date || 0) - (a.date || 0); });
                    openEntry(sorted[0].id);
                } else {
                    editorTitle.value = '';
                    editorContent.value = '';
                    metaType.textContent = '速记';
                    metaDate.textContent = formatDate(new Date());
                    moodPicker.style.display = 'none';
                }
                renderList();
            }

            // 抽屉开关
            function openDrawer() {
                listDrawer.classList.add('open');
                drawerOverlay.classList.add('open');
            }
            function closeDrawer() {
                listDrawer.classList.remove('open');
                drawerOverlay.classList.remove('open');
            }

            // ==================== 事件绑定 ====================
            document.getElementById('menuBtn').addEventListener('click', openDrawer);
            document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            document.getElementById('newNoteBtn').addEventListener('click', function() { createEntry('note'); });
            document.getElementById('newDiaryBtn').addEventListener('click', function() { createEntry('diary'); });
            document.getElementById('deleteBtn').addEventListener('click', deleteEntry);

            editorTitle.addEventListener('input', autoSave);
            editorContent.addEventListener('input', autoSave);

            moodPicker.querySelectorAll('.mood-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var e = getCurrentEntry();
                    if (!e) return;
                    var mood = this.getAttribute('data-mood');
                    e.mood = (e.mood === mood) ? '' : mood;
                    moodPicker.querySelectorAll('.mood-btn').forEach(function(b) {
                        b.classList.toggle('active', b.getAttribute('data-mood') === e.mood);
                    });
                    autoSave();
                });
            });

            // 关闭前保存
            window.addEventListener('beforeunload', function() {
                syncCurrent();
                saveData();
            });

            // 初始化
            loadData();
            if (entries.length > 0) {
                var sorted = entries.slice().sort(function(a, b) { return (b.date || 0) - (a.date || 0); });
                openEntry(sorted[0].id);
            } else {
                metaDate.textContent = formatDate(new Date());
                renderList();
            }
            statusText.textContent = '就绪';
        })();
    </script>
</body>
</html>
